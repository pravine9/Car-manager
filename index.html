<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Tracker</title>
    <meta name="description" content="Track and shortlist cars you're looking to buy, with DVLA data auto-fill.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="vehicleTaxRates.js"></script>
    <script defer src="app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<div x-data="carTracker" class="max-w-[1440px] mx-auto px-4 py-6 sm:px-6 lg:px-8">

    <!-- ═══ Header ═══ -->
    <header class="text-center mb-8">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-1">🚗 Car Tracker</h1>
        <p class="text-slate-500 text-sm font-medium mb-3">Track &amp; shortlist cars with DVLA data</p>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-teal-50 text-teal-700 rounded-full text-[10px] font-bold uppercase tracking-widest border border-teal-100/50 shadow-sm">
            <svg class="w-2.5 h-2.5" width="10" height="10" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
            <span x-text="collection"></span>
        </div>
    </header>

    <!-- ═══ Quick Add ═══ -->
    <div class="max-w-lg mx-auto mb-10 text-center">
        <div class="bg-white border-2 border-slate-200 rounded-xl p-5 sm:p-6 shadow-sm group hover:border-teal-400 transition-all duration-300">
            <label class="block text-xs font-bold text-teal-800 uppercase tracking-widest mb-3">Vehicle Registration</label>
            <div class="flex flex-col sm:flex-row gap-3 justify-center items-center">
                <input type="text" x-model="quickReg" x-ref="quickRegInput" x-init="$el.focus()" 
                       placeholder="e.g. HJ15 CDO" maxlength="10"
                       @keydown.enter="quickAdd()"
                       class="w-full sm:w-48 px-4 py-2 border-2 border-teal-50 rounded-lg text-lg uppercase font-mono font-bold tracking-wider text-center focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none bg-slate-50 focus:bg-white transition-all placeholder:font-normal placeholder:text-slate-300">
                <button @click="quickAdd()" :disabled="loading"
                        class="w-full sm:w-auto px-6 py-2 bg-teal-600 hover:bg-teal-700 disabled:opacity-50 text-white font-bold text-sm rounded-lg transition-all shadow-sm hover:shadow-teal-200 hover:-translate-y-0.5 active:translate-y-0 cursor-pointer whitespace-nowrap">
                    <span x-show="!loading">Add Car</span>
                    <span x-show="loading">...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ Toolbar ═══ -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <!-- Search -->
            <div class="relative flex-1 sm:flex-none">
                <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" x-model="search" placeholder="Search…" class="w-full sm:w-52 pl-8 pr-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
            </div>
            <span class="text-xs text-slate-400 font-medium whitespace-nowrap" x-text="filteredCars.length + ' of ' + cars.length + ' cars'"></span>
        </div>
        <div class="flex gap-2">
            <button @click="openAdd()" class="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-lg transition shadow-sm cursor-pointer">+ Add</button>
            <a href="/bulk" class="px-3 py-1.5 border border-teal-200 bg-teal-50 hover:bg-teal-100 text-teal-700 text-sm font-semibold rounded-lg transition cursor-pointer">Bulk DVLA → CSV</a>
            <button @click="exportData()" class="px-3 py-1.5 border border-slate-200 hover:bg-slate-100 text-sm font-medium rounded-lg transition cursor-pointer">Export</button>
            <label class="px-3 py-1.5 border border-slate-200 hover:bg-slate-100 text-sm font-medium rounded-lg transition cursor-pointer">
                Import
                <input type="file" accept=".json" @change="importData($event)" class="hidden">
            </label>
        </div>
    </div>

    <!-- ═══ Table ═══ -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto" style="max-height:75vh; overflow-y:auto;">
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                    <tr>
                        <th class="px-3 py-3 w-10 text-center">⭐</th>
                        <th @click="toggleSort('registration')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Reg <span class="text-teal-600" x-text="sortIcon('registration')"></span>
                        </th>
                        <th @click="toggleSort('make')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Make <span class="text-teal-600" x-text="sortIcon('make')"></span>
                        </th>
                        <th @click="toggleSort('year')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Year <span class="text-teal-600" x-text="sortIcon('year')"></span>
                        </th>
                        <th @click="toggleSort('fuelType')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Fuel <span class="text-teal-600" x-text="sortIcon('fuelType')"></span>
                        </th>
                        <th @click="toggleSort('engineCapacity')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Engine <span class="text-teal-600" x-text="sortIcon('engineCapacity')"></span>
                        </th>
                        <th @click="toggleSort('colour')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Colour <span class="text-teal-600" x-text="sortIcon('colour')"></span>
                        </th>
                        <th @click="toggleSort('price')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Price <span class="text-teal-600" x-text="sortIcon('price')"></span>
                        </th>
                        <th @click="toggleSort('mileage')" class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider cursor-pointer hover:text-teal-600 select-none">
                            Mileage <span class="text-teal-600" x-text="sortIcon('mileage')"></span>
                        </th>
                        <th class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider">MOT</th>
                        <th class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider">Tax</th>
                        <th class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider">Notes</th>
                        <th class="px-3 py-3 font-semibold text-xs uppercase text-slate-500 tracking-wider">Link</th>
                        <th class="px-3 py-3 w-24 text-right font-semibold text-xs uppercase text-slate-500 tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-for="car in filteredCars" :key="car.id">
                        <tr class="hover:bg-teal-50/40 transition-colors">
                            <td class="px-3 py-2.5 text-center">
                                <button @click="toggleStar(car)" class="hover:scale-110 transition-transform cursor-pointer" :class="car.starred ? 'opacity-100' : 'opacity-30 hover:opacity-60'" x-text="car.starred ? '⭐' : '☆'"></button>
                            </td>
                            <td class="px-3 py-2.5 font-semibold font-mono text-teal-700 whitespace-nowrap" x-text="car.registration"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap" x-text="car.make || '—'"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap" x-text="car.year || '—'"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap" x-text="car.fuelType || '—'"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap font-mono text-slate-600" x-text="fmtEngineL(car.engineCapacity) || '—'"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap" x-text="car.colour || '—'"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap font-mono font-medium" x-text="fmtPrice(car.price) || '—'"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap font-mono text-slate-600" x-text="fmtMileage(car.mileage) || '—'"></td>
                            <td class="px-3 py-2.5 whitespace-nowrap text-xs">
                                <span :class="car.motStatus === 'Valid' ? 'text-emerald-600' : 'text-red-500'" x-text="car.motStatus || '—'"></span>
                                <template x-if="car.motExpiry">
                                    <span class="text-slate-400 ml-1" x-text="'(' + fmtDate(car.motExpiry) + ')'"></span>
                                </template>
                            </td>
                            <td class="px-3 py-2.5 whitespace-nowrap text-xs">
                                <span :class="car.taxStatus === 'Taxed' ? 'text-emerald-600' : 'text-amber-500'" x-text="car.taxStatus || '—'"></span>
                            </td>
                            <td class="px-3 py-2.5 max-w-[200px] truncate text-slate-500 italic text-xs" x-text="car.notes || ''"></td>
                            <td class="px-3 py-2.5">
                                <template x-if="car.url">
                                    <a :href="car.url" target="_blank" class="text-teal-600 hover:underline text-xs">View →</a>
                                </template>
                            </td>
                            <td class="px-3 py-2.5 text-right">
                                <div class="flex gap-1 justify-end">
                                    <button @click="openEdit(car)" class="p-1 rounded hover:bg-teal-100 text-slate-400 hover:text-teal-600 transition cursor-pointer" title="Edit">✏️</button>
                                    <button @click="deleteCar(car.id)" class="p-1 rounded hover:bg-red-50 text-slate-400 hover:text-red-500 transition cursor-pointer" title="Delete">🗑️</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <template x-if="filteredCars.length === 0">
                        <tr>
                            <td colspan="14" class="px-3 py-16 text-center text-slate-400">
                                <div class="text-3xl mb-2">🚗</div>
                                <p class="font-medium" x-text="cars.length === 0 ? 'No cars yet — use Quick Add above' : 'No cars match your search'"></p>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ═══ Modal ═══ -->
    <div x-show="modalOpen" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm p-4" @click.self="closeModal()" @keydown.escape.window="closeModal()">
        <div x-show="modalOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95 translate-y-2" x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
             class="bg-white rounded-xl shadow-xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden" @click.stop>

            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h2 class="text-lg font-bold text-slate-900" x-text="editing ? 'Edit Car' : 'Add New Car'"></h2>
                <button @click="closeModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer p-1 rounded hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Body -->
            <div class="flex-1 overflow-y-auto p-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-5 gap-y-4">

                    <!-- Registration + DVLA lookup -->
                    <div class="sm:col-span-2 lg:col-span-3 flex flex-col sm:flex-row gap-3 items-end bg-teal-50 p-4 rounded-lg border border-teal-100">
                        <div class="flex-1 w-full">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Registration <span class="text-red-400">*</span></label>
                            <input type="text" x-model="form.registration" placeholder="AB12 CDE" maxlength="10"
                                   class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm uppercase font-mono focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none">
                        </div>
                        <button @click="lookupDvla()" :disabled="loading" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 disabled:opacity-50 text-white text-sm font-semibold rounded-lg transition whitespace-nowrap cursor-pointer">
                            🔍 DVLA Lookup
                        </button>
                    </div>

                    <!-- DVLA message -->
                    <template x-if="dvlaMsg">
                        <div class="sm:col-span-2 lg:col-span-3">
                            <p class="text-sm text-teal-700 bg-teal-50 px-3 py-1.5 rounded-lg inline-block" x-text="dvlaMsg"></p>
                        </div>
                    </template>

                    <!-- DVLA fields (read-only-ish) -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Make</label>
                        <input type="text" x-model="form.make" placeholder="e.g. FORD" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Year</label>
                        <input type="text" x-model="form.year" placeholder="2015" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Fuel</label>
                        <input type="text" x-model="form.fuelType" placeholder="PETROL" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Engine (cc)</label>
                        <input type="number" x-model="form.engineCapacity" placeholder="1596" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Colour</label>
                        <input type="text" x-model="form.colour" placeholder="SILVER" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">CO₂ (g/km)</label>
                        <input type="number" x-model="form.co2" placeholder="149" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none font-mono">
                    </div>

                    <!-- Tax Info -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Tax Status</label>
                        <input type="text" x-model="form.taxStatus" placeholder="e.g. Taxed" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none font-medium" :class="form.taxStatus === 'Taxed' ? 'text-emerald-700' : 'text-slate-700'">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Tax Due</label>
                        <input type="date" x-model="form.taxDueDate" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Annual Tax</label>
                        <div class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 font-bold text-teal-700 flex justify-between items-center h-[38px]">
                            <span x-text="getTaxRate() ? '£' + getTaxRate().annual : '—'"></span>
                            <span class="text-[10px] text-slate-400 font-medium uppercase tracking-tighter" x-text="getTaxRate() ? getTaxRate().band : ''"></span>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="sm:col-span-2 lg:col-span-3 border-t border-slate-100 my-1"></div>

                    <!-- User fields -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Price (£)</label>
                        <input type="number" x-model="form.price" placeholder="9990" step="1" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Mileage</label>
                        <input type="number" x-model="form.mileage" placeholder="87400" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none font-mono">
                    </div>
                    <div class="sm:col-span-2 lg:col-span-1">
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Listing URL</label>
                        <input type="url" x-model="form.url" placeholder="https://…" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none text-teal-700 truncate">
                    </div>
                    <div class="sm:col-span-2 lg:col-span-3">
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Notes</label>
                        <textarea x-model="form.notes" rows="2" placeholder="Full service history, clean MOT…" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none resize-y"></textarea>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-6 py-4 border-t border-slate-100 flex flex-wrap-reverse sm:flex-nowrap justify-end gap-3 bg-slate-50">
                <button x-show="editing" @click="deleteCar(form.id)" class="mr-auto px-4 py-2 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition cursor-pointer">Delete</button>
                <button @click="closeModal()" class="px-4 py-2 text-sm font-medium border border-slate-200 rounded-lg hover:bg-slate-100 transition cursor-pointer">Cancel</button>
                <button @click="save()" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-lg transition shadow-sm cursor-pointer">Save</button>
            </div>
        </div>
    </div>

</div>
</body>
</html>
